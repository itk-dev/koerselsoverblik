# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The import mappings for driving data. See "Import mappings" in the README.
    app.driving_data_mapping_dir: '%kernel.project_dir%/config/import/driving_data'
    # The maximum number of days in one upload. See "Configuration" in the README.
    app.driving_data_max_days: '%env(int:APP_DRIVING_DATA_MAX_DAYS)%'
    # The limits for one extract. See "Configuration" in the README.
    app.driving_data_max_file_size: '%env(int:APP_DRIVING_DATA_MAX_FILE_SIZE)%'
    app.driving_data_max_uncompressed_size: '%env(int:APP_DRIVING_DATA_MAX_UNCOMPRESSED_SIZE)%'
    app.driving_data_max_rows: '%env(int:APP_DRIVING_DATA_MAX_ROWS)%'
    app.driving_data_max_columns: '%env(int:APP_DRIVING_DATA_MAX_COLUMNS)%'
    # The time zone of the wall-clock times in an extract. See "Configuration" in the README.
    app.timezone: '%env(APP_TIMEZONE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # No production service uses the provider yet, so the container removes it. The integration
        # test gets it from the container to check the autowiring of APP_DRIVING_DATA_MAPPING.
        App\Import\Mapping\MappingProvider:
            autowire: true
            public: true
