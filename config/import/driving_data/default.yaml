# The extract of the planning system: one sheet, a title in row 1 and the column headers in row 3.
# See "Import mappings" in the README.
sheet: 0
header_row: 3
row_id: [RouteStopID]
# The other columns that the copy of a row keeps, so that a later task can read them with no new
# upload. The list has only the columns of the current report, in the order of the report. The
# personal data is never kept (see "exclude_columns" and ADR 006). Add a new column of the extract
# here only after a check for personal data.
keep_columns:
    - TripID
    - blokstart
    - blokslut
    - IsCancelled
    - passengers
    - prisprminut
    - aflysningsvarsel
    - CancellationID
    - PlaceID
    - AddressID
    - LocationID
    - aflysningstidspunkt
    # The channel, the type and the category of a cancellation. Empty when the stop is not
    # cancelled. The list of categories is not fixed.
    - afbestillingskanal
    - aflysningstype
    - aflysningskategori
    # The id of the vehicle of the route in the planning system. A vehicle profile is on many
    # routes at the same time, so it is not one vehicle (see "vogntype").
    - vogn
    # The id of the driver of the route in the planning system. Never show it, or write it to a
    # log or to the output of a command (ADR 006). It is in "hidden_columns".
    - chauffør
    # For the number of vehicles (#181): "Profile" or "Vehicle", "Person" or "Profile", and the id
    # of the supplier of the contract of the route.
    - vogntype
    - chaufførtype
    - operatør
# The kept columns with personal data. The pages show "(skjult)" in place of the value.
hidden_columns: [chauffør]
# The personal data of the extract (ADR 004 and ADR 006). The current report does not export these
# columns. The list stops a mapping that keeps one of them, and the validate command does not show
# them as not read.
exclude_columns: [PersonName, Adresse, Post-nr, By, Labels, Comment]
fields:
    route: { column: RouteName, type: string, required: true }
    person_id: { column: PersonID, type: string, required: true }
    service_date: { column: Date, type: date, format: Y-m-d, required: true }
    # The block number identifies the route run.
    run: { column: blocknumber, type: int, required: true }
    stop_type:
        column: StopType
        type: string
        required: true
        map: { IN: pickup, OUT: drop_off }
    stop_status:
        column: Status
        type: string
        required: true
        map: { Served: completed, Cancelled: cancelled, Pending: pending }
    passengers_after:
        column: passengersaftercancel
        type: int
        required: true
    next_distance_km: { column: ToNextDistance, type: float }
    next_duration_min: { column: ToNextDuration, type: float }
    # An Excel time. It can be 24:00 or more after midnight on the same service day. The transport
    # office measures punctuality against the planned departure, not the planned arrival.
    planned_time: { column: PlannedDeparture, type: time, required: true }
    # Empty when the stop has no registration.
    actual_time: { column: StatusUpdateTime, type: datetime, format: excel }
    # Optional, so that a new code gives a warning and does not reject the row. No figure needs it
    # yet.
    planned_solo:
        column: kørselstype
        type: bool
        true_values: [Solo]
        false_values: [Samkørsel]
    # The institution of the trip. Never show it with a person id, or write it to a log or to the
    # output of a command.
    location_name: { column: Placename, type: string }
    # "yes" when the trip is cancelled on an earlier date, or more than 60 minutes before the planned
    # arrival. "no" in all other rows, also when the stop is not cancelled. Optional, so that a new
    # code gives a warning and does not reject the row.
    cancelled_in_time:
        column: RettidigAflysningsvarsel
        type: bool
        true_values: ['yes']
        false_values: ['no']
