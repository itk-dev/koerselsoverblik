framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            assets/: ''
            vendor/itk-dev/itkaarhus-design-system/assets/: itkaarhus-ds
        missing_import_mode: strict
        # All supported browsers have import maps. The polyfill is an inline script from a CDN.
        importmap_polyfill: false

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
