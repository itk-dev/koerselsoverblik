monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - openid_connect_audit # The authentication log. See "Authentication log" in README.md
        - driving_data_audit # The log of the clears of driving data. See "Driving data log" in README.md

# All logs go to stderr. The application writes no log files.
when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

# The tests write to a file, so that the log records do not go into the output of PHPUnit and
# Infection.
when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
                # The handler keeps the records in memory until an error. With no limit, it keeps
                # each SQL query of a long test. The last records still show what led to an error.
                buffer_size: 50
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            # The audit logs have their own handler, so that the error threshold of the main
            # handler does not discard them.
            audit:
                type: stream
                path: php://stderr
                level: info
                channels: ['openid_connect_audit', 'driving_data_audit']
                formatter: monolog.formatter.json
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!deprecation']
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
