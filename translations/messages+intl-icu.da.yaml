overview:
  title: Overblik
  heading: Bliver borgerkørslen bedre eller værre?
  lede: "{period} sammenlignet med {comparison}."
  trips:
    label: Personture
    note: "{completed, number} gennemført · {cancelled, number} aflyst{pending, plural, =0 {} other { · # uden registrering}}"
    help:
      title: Personture
      body: Én persontur er én borgers tur fra afhentning til afsætning. Kører to borgere sammen i samme bil, tæller det som to personture. Tallet tæller alle bestilte ture i perioden, også de aflyste ture og de ture, hvor chaufføren ikke har registreret afhentningen. Status for afhentningen giver status for turen.
  citizens:
    label: Unikke borgere
    note: Forskellige borgere, uanset antal ture
    help:
      title: Unikke borgere
      body: Hvor mange forskellige borgere der blev kørt i perioden. Den samme borger tæller kun én gang, uanset antallet af ture. En borger, hvis ture alle blev aflyst, tæller ikke med. En tur, hvor chaufføren ikke har registreret afhentningen, tæller med. Tallet er en optælling af borger-id'erne i kørselsdata.
  punctuality:
    label: Rettidighed
    title: Rettidighed mod servicemålet
  suppliers:
    title: Leverandørerne side om side
    subtitle: Samme mål for alle leverandører i den valgte periode.
    caption: Nøgletal pr. leverandør
    cancelled: Aflyst
    source: "Kilde: kørselsdata"
  real_solo:
    label: Reelt solo
    note: "{count, number} vognløb med én borger ad gangen"
    help:
      title: Reelt solo
      body: Andelen af vognløbene, hvor der aldrig var mere end én borger i bilen ad gangen. Det er ikke det samme som planlagt solokørsel. En del af turene er bestilt som samkørsel, men blev alligevel kørt med én borger. Tallet bruger antallet af borgere i bilen efter hvert stop, som ikke er aflyst. Aflyste vognløb og vognløb uden borgere i bilen indgår ikke. Et stop uden registrering indgår med det planlagte antal, så den aktuelle periode delvist viser planen.

