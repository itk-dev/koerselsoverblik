punctuality:
  title: Rettidighed
  lede: "{period} sammenlignet med {comparison}. Rettidigheden måles ved afhentning og afsætning, for hver borger og for hvert vognløb."
  goal:
    label: Servicemål
    rule: Højst {minutes} minutter for sent · {target} % rettidighed
    status: "{count} af {total} målinger når målet"
  target_note: Mål {target} %
  target_met: Målet er nået
  target_gap: "{gap} pct.point under målet"
  points: "{change} pct.point"
  measure:
    pickup_per_citizen: Afhentning pr. borger
    drop_off_per_citizen: Afsætning pr. borger
    pickup_per_run: Afhentning pr. vognløb
    drop_off_per_run: Afsætning pr. vognløb
  help:
    pickup_per_citizen:
      title: Rettidig afhentning pr. borger
      body: Andelen af borgerne, der blev hentet højst {minutes} minutter efter det planlagte tidspunkt. Hver afhentning tæller for sig. Målingen sammenligner chaufførens indtastning med den planlagte afgangstid. Kommer bilen før tid, tæller det som til tiden. Aflyste stop og stop uden indtastning indgår ikke.
    drop_off_per_citizen:
      title: Rettidig afsætning pr. borger
      body: Andelen af borgerne, der blev sat af højst {minutes} minutter efter det planlagte tidspunkt. Hver afsætning tæller for sig. Det er det tal, der ligger tættest på, hvad den enkelte borger oplever. Aflyste stop og stop uden indtastning indgår ikke.
    pickup_per_run:
      title: Rettidig afhentning pr. vognløb
      body: Andelen af vognløb, hvor den første borger blev hentet højst {minutes} minutter efter det planlagte tidspunkt. Et vognløb er en blok i udtrækket. Den første afhentning er afhentningen med det tidligste planlagte tidspunkt, som ikke er aflyst. Målingen viser, om bilen kommer af sted til tiden.
    drop_off_per_run:
      title: Rettidig afsætning pr. vognløb
      body: Andelen af vognløb, hvor den sidste borger i bilen blev sat af højst {minutes} minutter efter det planlagte tidspunkt. Den sidste afsætning er afsætningen med det seneste planlagte tidspunkt, som ikke er aflyst. Forsinkelser tidligere i vognløbet tæller ikke med her. Dem viser rettidigheden pr. borger.
