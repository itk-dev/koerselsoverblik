### ### Tests and code analysis
###
### Runs PHPStan, Rector and the tests with the coverage gate. The jobs use the same
### Taskfile tasks as local development. Mutation testing runs only on the release
### branches (see mutation-full.yml).
###
### The template workflows run the coding standards and the Composer checks.

name: Tests

env:
  COMPOSE_USER: runner

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  code-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          task composer -- install
          task code-analysis

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          task composer -- install
          task rector:check

  tests:
    name: Tests with coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          task composer -- install
          task test:coverage:check
