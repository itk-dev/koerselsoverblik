on:
  push:
    tags:
      - "*.*.*"

name: Create Github Release

permissions:
  contents: write

env:
  COMPOSE_USER: runner

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Composer install
        run: |
          docker network create frontend
          docker compose run --rm --no-deps -e APP_ENV=prod phpfpm composer install --no-dev -o --classmap-authoritative
          docker compose run --rm --no-deps -e APP_ENV=prod phpfpm composer clear-cache

      # The prod environment serves the assets from public/assets.
      - name: Compile assets
        run: |
          docker compose run --rm --no-deps -e APP_ENV=prod phpfpm bin/console asset-map:compile

      - name: Make assets dir
        run: |
          mkdir -p ../assets

      - name: Create archive
        run: |
          sudo chown -R runner:runner ./
          tar --exclude='.git' -zcf ../assets/${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz ./

      - name: Create checksum
        run: |
          cd ../assets
          sha256sum ${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz > ../assets/checksum.txt

      - name: Create a release in GitHub and uploads assets
        run: gh release create ${{ github.ref_name }} --verify-tag --generate-notes ../assets/*.*
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash
